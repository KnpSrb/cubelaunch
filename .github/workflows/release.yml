# Сборка установщиков и публикация релиза.
#
# Запуск: git tag v0.2.0 && git push origin v0.2.0 (версия в тэге должна совпадать с версией
# в package.json / tauri.conf.json / Cargo.toml — см. `npm run version:set`).
# Результат — черновик релиза с установщиками и latest.json. Лаунчеры увидят обновление
# только после публикации черновика.
#
# Секреты репозитория:
#   TAURI_SIGNING_PRIVATE_KEY           — содержимое приватного ключа подписи обновлений (обязательно)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — пароль к нему (если задан)
#   CUBELAUNCH_MSA_CLIENT_ID            — Client ID Azure для входа через Microsoft (необязательно)
#   CUBELAUNCH_CURSEFORGE_KEY           — ключ CurseForge API (необязательно)
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID — подпись и нотаризация macOS (необязательно)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Адрес обновлений указывает на этот репозиторий.
      - name: Updater endpoint
        shell: bash
        run: node scripts/set-update-repo.mjs "$GITHUB_REPOSITORY"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CUBELAUNCH_MSA_CLIENT_ID: ${{ secrets.CUBELAUNCH_MSA_CLIENT_ID }}
          CUBELAUNCH_CURSEFORGE_KEY: ${{ secrets.CUBELAUNCH_CURSEFORGE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cubelaunch v__VERSION__"
          releaseBody: "Что нового — см. ниже. Установщики: Windows — .exe, macOS — .dmg, Linux — .AppImage / .deb / .rpm."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
